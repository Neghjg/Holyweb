[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "backend.settings"
testpaths = ["tests"]
markers = ["clickhouse: needs real ClickHouse"]
addopts = "-m 'not clickhouse'"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["plan/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
